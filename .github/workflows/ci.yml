name: CI

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-policy:
    name: fmt-policy
    # rustfmt does not compile code, so a Linux runner can check the
    # Windows-only crates.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Installs the toolchain that rust-toolchain.toml gives, with its
      # components, so CI uses the same rustfmt as local builds.
      - name: Install the toolchain
        run: rustup toolchain install
      - name: Check the formatting
        run: cargo fmt --all -- --check
      - name: Asset policy
        run: cargo xtask policy

  pr-description:
    name: pr-description
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The body comes from the event file, not from an expression in the
      # script, so text in the body cannot run as a command.
      - name: Check the template sections
        run: |
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" \
            | tr -d '\r' \
            | perl -0pe 's/<!--.*?-->//gs' > body.md
          fail=0
          for section in What Tested; do
            text=$(awk -v s="$section" '
              $0 ~ "^## " s "[[:space:]]*$" { on = 1; next }
              /^## / { on = 0 }
              on' body.md | tr -d '[:space:]')
            if [ -z "$text" ]; then
              echo "::error::The PR description has no text under \"## $section\". Use the template in .github/pull_request_template.md."
              fail=1
            fi
          done
          exit $fail

  check:
    name: check
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked
